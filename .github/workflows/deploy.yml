name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. `id-token: write` is required for the OIDC handshake that
# actions/deploy-pages uses; without it the deploy step fails.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once. `cancel-in-progress: false` lets an
# in-flight deploy finish instead of leaving Pages in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs dependencies, runs `astro build`, and uploads `dist/` as the
      # Pages artifact. It detects the package manager from the lockfile.
      - name: Build Astro site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
