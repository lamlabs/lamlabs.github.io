name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level. The deploy job widens this for itself
# below — `id-token: write` is the OIDC handshake actions/deploy-pages needs.
permissions:
  contents: read

# Never run two Pages deploys at once. `cancel-in-progress: false` lets an
# in-flight deploy finish instead of leaving Pages in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Separate from `build` on purpose. The Astro action installs dependencies and
  # uploads the artifact in one step, so a type check placed after it would run
  # against an already-uploaded build. This is the only type gate in the repo.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs dependencies, runs `astro build`, and uploads `dist/` as the
      # Pages artifact. It detects the package manager from the lockfile.
      - name: Build Astro site
        uses: withastro/action@v6

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
