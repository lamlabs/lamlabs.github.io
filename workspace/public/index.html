<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="workbench-token" content="__WORKBENCH_TOKEN__">
<title>Workbench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <strong>Workbench</strong>
  <span id="counts" class="counts"></span>
  <span id="conn" class="dim"></span>
  <button id="new-session" type="button">+ New session</button>
</header>
<div class="app">
  <section class="left">
    <div id="list"></div>
  </section>
  <section class="right" id="chat">
    <p class="dim pad">Pick a session on the left.</p>
  </section>
</div>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <h2>New Claude Code session</h2>
    <label>Project <select id="f-project" name="project" required></select></label>
    <label>Task <input id="f-task" name="task" list="task-list" placeholder="defaults to the project"></label>
    <datalist id="task-list"></datalist>
    <label>Name <input id="f-name" name="name" placeholder="e.g. fix, review"></label>
    <label>First prompt <textarea id="f-prompt" name="prompt" rows="4" placeholder="optional"></textarea></label>
    <p class="error" id="new-error"></p>
    <div class="row end">
      <button value="cancel" formnovalidate type="submit" class="ghost">Cancel</button>
      <button value="start" type="submit">Start</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
